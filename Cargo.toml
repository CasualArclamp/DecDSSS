# made by CasualArclamp
[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/CasualArclamp/DecDSSS"
# eframe/egui (the GUI, M2) need Rust 1.95; one MSRV for the whole workspace.
rust-version = "1.95"

[workspace.dependencies]
num-complex = "0.4.6"
rustfft = "6.4"
anyhow = "1"
thiserror = "2"
rayon = "1.10"

# DSP is unusably slow unoptimised; keep dev builds fast enough to run the
# modem in tests while still compiling quickly (same tradeoff as DecSAT).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
lto = "thin"
