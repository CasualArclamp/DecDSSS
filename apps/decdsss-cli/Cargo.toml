# made by CasualArclamp
[package]
name = "decdsss-cli"
description = "DecDSSS command line: mode table, transmit/receive to WAV, channel simulation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "decdsss"
path = "src/main.rs"

[dependencies]
decdsss-audio = { path = "../../crates/decdsss-audio" }
decdsss-codec2 = { path = "../../crates/decdsss-codec2" }
decdsss-core = { path = "../../crates/decdsss-core" }
decdsss-chan = { path = "../../crates/decdsss-chan" }
decdsss-image = { path = "../../crates/decdsss-image" }
decdsss-link = { path = "../../crates/decdsss-link" }
decdsss-phy = { path = "../../crates/decdsss-phy" }
decdsss-rig = { path = "../../crates/decdsss-rig" }
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
# Ctrl-C while the transmitter is keyed: let go before the program ends.
ctrlc = "3"

[build-dependencies]
# Puts assets/decdsss.ico into the Windows executable (see build.rs).
winresource = "0.1.34"
