# made by CasualArclamp
[package]
name = "decdsss-gui"
description = "DecDSSS desktop GUI (egui): narrowband DSSS / CSK modem for amateur radio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "decdsss-gui"
path = "src/main.rs"

[features]
# On Linux the sound card is reached through PipeWire as well as ALSA (see
# decdsss-audio). `--no-default-features` builds ALSA alone, which needs no
# libpipewire to build or to run.
default = ["pipewire"]
pipewire = ["decdsss-audio/pipewire"]

[dependencies]
decdsss-audio = { path = "../../crates/decdsss-audio" }
decdsss-chan = { path = "../../crates/decdsss-chan" }
decdsss-codec2 = { path = "../../crates/decdsss-codec2" }
decdsss-dsp = { path = "../../crates/decdsss-dsp" }
decdsss-core = { path = "../../crates/decdsss-core" }
decdsss-image = { path = "../../crates/decdsss-image" }
decdsss-kiwi = { path = "../../crates/decdsss-kiwi" }
decdsss-link = { path = "../../crates/decdsss-link" }
decdsss-phy = { path = "../../crates/decdsss-phy" }
decdsss-rig = { path = "../../crates/decdsss-rig" }
anyhow.workspace = true
rustfft.workspace = true
# The glow (OpenGL) renderer instead of eframe's default wgpu: plenty for 2-D
# scopes and a much smaller build. "x11"/"wayland" only matter on Linux.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
# Native file dialogs (Win32 on Windows, XDG desktop portal on Linux).
rfd = "0.17.2"
# PNG output for --screenshot (documentation and smoke tests).
image = { version = "0.25.10", default-features = false, features = ["png"] }

# eframe's defaults turn on winit's defaults; with eframe's defaults off we
# re-enable them here (Linux only), so building needs no X11/Wayland dev packages.
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30.13"

[build-dependencies]
# Puts assets/decdsss.ico into the Windows executable (see build.rs).
winresource = "0.1.34"
