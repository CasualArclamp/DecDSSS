# made by CasualArclamp
[package]
name = "decdsss-audio"
description = "Sound-card capture and playback (cpal) and WAV files for DecDSSS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Sound cards: WASAPI on Windows, ALSA on Linux. "realtime" promotes the audio
# callback threads to real-time (MMCSS) priority on Windows so a busy CPU cannot
# starve them.
cpal = { version = "0.18.2", features = ["realtime"] }
hound = "3.5.1"
# Lock-free single-producer/single-consumer ring buffer for the audio callbacks.
rtrb = "0.3.5"
thiserror = "2"

# The ALSA bindings cpal itself uses, for quieting alsa-lib's messages.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11"
