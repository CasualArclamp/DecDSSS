# made by CasualArclamp
[package]
name = "decdsss-audio"
description = "Sound-card capture and playback (cpal) and WAV files for DecDSSS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# PipeWire as an audio host on Linux and the BSDs, beside ALSA: cpal then picks it
# when a PipeWire daemon is running and falls back to ALSA when not. It links
# libpipewire-0.3 and its bindings are generated at build time, so building wants
# libpipewire-0.3-dev and libclang; leave it off for an ALSA-only build. A no-op on
# Windows and macOS.
pipewire = ["cpal/pipewire"]

[dependencies]
# Sound cards: WASAPI on Windows, ALSA on Linux. "realtime" promotes the audio
# callback threads to real-time (MMCSS) priority on Windows so a busy CPU cannot
# starve them.
cpal = { version = "0.18.2", features = ["realtime"] }
hound = "3.5.1"
# Lock-free single-producer/single-consumer ring buffer for the audio callbacks.
rtrb = "0.3.5"
thiserror = "2"

# MME (WinMM: waveIn / waveOut), which cpal does not offer. cpal already pulls in this
# crate version for WASAPI, so it adds nothing to the build.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Threading",
] }

# The ALSA bindings cpal itself uses, for quieting alsa-lib's messages.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11"
